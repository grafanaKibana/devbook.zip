name: DevBook Improvement

on:
  schedule:
    - cron: "23 */6 * * *"
  pull_request:
    paths:
      - .github/workflows/devbook-improvement.yml
      - .github/workflows/devbook-improvement-feedback.yml
      - .github/devbook-improvement.json
      - .scripts/DevBook.Tooling/**
      - .scripts/DevBook.Tooling.Tests/**
      - .scripts/*.slnx
      - .scripts/global.json
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [DevBook Improvement Feedback]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Credential-free demo/fixture, selection, or protected maintenance
        required: true
        default: demo
        type: choice
        options: [demo, dry-run, apply, fixture]
      model:
        description: Exact Claude model identifier; no fallback is configured
        required: true
        default: claude-sonnet-5-5
        type: string
      with_model:
        description: Use protected subscription OAuth for a manual dry-run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Covers source work, rendering, and publication; never cancel an in-flight write.
concurrency:
  group: devbook-improvement
  cancel-in-progress: false
  queue: max

jobs:
  feedback:
    if: >-
      github.ref == 'refs/heads/main' && vars.DEVBOOK_IMPROVEMENT_ACTIVATED == 'true' &&
      (github.event_name == 'issue_comment' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      feedback_pr: ${{ steps.admit.outputs.feedback_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - name: Authenticate feedback wakeup against current GitHub data
        id: admit
        working-directory: .scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          dotnet run --project DevBook.Tooling -- improvement --repo-root .. \
            --check-feedback-trigger --output-dir artifacts/feedback-admission

  demo:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'schedule' && (vars.DEVBOOK_IMPROVEMENT_ACTIVATED != 'true' || vars.DEVBOOK_IMPROVEMENT_SCHEDULE_ENABLED != 'true')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'demo' || (inputs.mode == 'dry-run' && inputs.with_model == false)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - name: Test native core and run credential-free flow
        working-directory: .scripts
        env:
          MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          SELECT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.100
          dotnet test DevBook.Tooling.slnx --configuration Release
          mode=demo
          if [ "$SELECT_ONLY" = true ]; then mode=dry-run; fi
          dotnet run --project DevBook.Tooling -- improvement --repo-root .. \
            --config .github/devbook-improvement.json --model "$MODEL" --"$mode" \
            --output-dir artifacts/devbook-improvement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devbook-improvement-${{ github.run_id }}
          path: artifacts/devbook-improvement
          if-no-files-found: warn
          overwrite: true

  maintenance:
    needs: feedback
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && vars.DEVBOOK_IMPROVEMENT_ACTIVATED == 'true' && vars.DEVBOOK_IMPROVEMENT_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'apply' || (inputs.mode == 'dry-run' && inputs.with_model))) ||
      (needs.feedback.result == 'success' && needs.feedback.outputs.feedback_pr != '' && needs.feedback.outputs.feedback_pr != '0'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: devbook-improvement-production
      deployment: false
    outputs:
      export_ready: ${{ steps.maintain.outputs.export_ready }}
      export_mode: ${{ steps.maintain.outputs.export_mode }}
      request-artifact-id: ${{ steps.request-upload.outputs.artifact-id }}
    steps:
      - name: Check protected activation gates
        env:
          REQUESTED_MODE: ${{ (github.event_name == 'schedule' || needs.feedback.outputs.feedback_pr != '' && needs.feedback.outputs.feedback_pr != '0') && 'apply' || inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
          SUBSCRIPTION_ONLY: ${{ vars.DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED }}
          USAGE_CREDITS_DISABLED: ${{ vars.DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED }}
          PR_WORKFLOWS_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_PR_WORKFLOWS_CONFIRMED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$ACTIVATED" = true
          test "$SUBSCRIPTION_ONLY" = true
          test "$USAGE_CREDITS_DISABLED" = true
          case "$REQUESTED_MODE" in dry-run|apply) ;; *) exit 1 ;; esac
          if [ "$REQUESTED_MODE" = apply ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            test "$PR_WORKFLOWS_CONFIRMED" = true
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.DEVBOOK_GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install repository validation dependencies
        run: npm ci --prefix Web
      - name: Install locked Quartz plugins
        working-directory: Web
        run: |
          npx quartz plugin install
          git diff --exit-code -- quartz.lock.json
      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.285
      - name: Run bounded maintenance and persist export handoff
        id: maintain
        working-directory: .scripts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEVBOOK_GITHUB_TOKEN: ${{ secrets.DEVBOOK_GITHUB_TOKEN }}
          DEVBOOK_IMPROVEMENT_MODE: ${{ (github.event_name == 'schedule' || needs.feedback.outputs.feedback_pr != '' && needs.feedback.outputs.feedback_pr != '0') && 'apply' || inputs.mode }}
          DEVBOOK_IMPROVEMENT_ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
          DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED }}
          DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED }}
          DEVBOOK_IMPROVEMENT_PR_WORKFLOWS_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_PR_WORKFLOWS_CONFIRMED }}
          MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || vars.DEVBOOK_IMPROVEMENT_MODEL || 'claude-sonnet-5-5' }}
          FEEDBACK_PR: ${{ needs.feedback.outputs.feedback_pr || '0' }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.100
          feedback=()
          if [ "$FEEDBACK_PR" -gt 0 ]; then feedback=(--feedback-pr "$FEEDBACK_PR"); fi
          dotnet run --project DevBook.Tooling -- improvement --repo-root .. \
            --config .github/devbook-improvement.json --model "$MODEL" \
            --"$DEVBOOK_IMPROVEMENT_MODE" --with-model "${feedback[@]}" --output-dir artifacts/devbook-improvement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devbook-improvement-${{ github.run_id }}
          path: artifacts/devbook-improvement
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: request-upload
        if: steps.maintain.outputs.export_ready == 'true'
        with:
          name: devbook-export-request-${{ github.run_id }}
          path: artifacts/devbook-improvement/export-request.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  render:
    needs: maintenance
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'fixture') ||
      (needs.maintenance.result == 'success' && needs.maintenance.outputs.export_ready == 'true' && needs.maintenance.outputs.export_mode == 'render'))
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.export.outputs.ready }}
      artifact-id: ${{ steps.native-upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.native-upload.outputs.artifact-digest }}
      bundle-sha256: ${{ steps.bundle-digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.maintenance.outputs.export_mode == 'render'
        with:
          artifact-ids: ${{ needs.maintenance.outputs.request-artifact-id }}
          path: artifacts/request
          digest-mismatch: error
      - uses: ./.github/actions/obsidian
        id: obsidian
      - name: Render through isolated desktop profile
        id: export
        working-directory: .scripts
        env:
          EXPORT_MODE: ${{ needs.maintenance.outputs.export_mode == 'render' && 'render' || 'fixture' }}
          APP_BUNDLE: ${{ steps.obsidian.outputs.app-bundle }}
          DEVBOOK_EXPORT_READ_TOKEN: ${{ needs.maintenance.outputs.export_mode == 'render' && github.token || '' }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.100
          if [ "$EXPORT_MODE" = fixture ]; then
            dotnet run --project DevBook.Tooling -- export fixture --repo-root .. \
              --app-bundle "$APP_BUNDLE" --output ../artifacts/export
          else
            dotnet run --project DevBook.Tooling -- export render --repo-root .. \
              --request ../artifacts/request/export-request.json --app-bundle "$APP_BUNDLE" --output ../artifacts/export
          fi
      - name: Bind the complete native bundle bytes
        id: bundle-digest
        if: steps.export.outputs.ready == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const sha = createHash('sha256').update(fs.readFileSync('artifacts/export/bundle.json')).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha}\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: native-upload
        if: steps.export.outputs.ready == 'true'
        with:
          name: devbook-syncer-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/export/bundle.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [maintenance, render]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment' || github.event_name == 'workflow_run') &&
      needs.maintenance.result == 'success' && needs.maintenance.outputs.export_ready == 'true' &&
      (needs.maintenance.outputs.export_mode == 'finalize' || (needs.render.result == 'success' && needs.render.outputs.ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: devbook-improvement-production
      deployment: false
    steps:
      - name: Verify trusted workflow and activation
        env:
          ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$ACTIVATED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.maintenance.outputs.request-artifact-id }}
          path: artifacts/request
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.maintenance.outputs.export_mode == 'render'
        with:
          artifact-ids: ${{ needs.render.outputs.artifact-id }}
          path: artifacts/export
          digest-mismatch: error
      - name: Register native artifact or resume exact-source validation
        working-directory: .scripts
        env:
          EXPORT_MODE: ${{ needs.maintenance.outputs.export_mode }}
          DEVBOOK_EXPORT_ARTIFACT_ID: ${{ needs.render.outputs.artifact-id }}
          DEVBOOK_EXPORT_ARTIFACT_DIGEST: ${{ needs.render.outputs.artifact-digest }}
          DEVBOOK_EXPORT_BUNDLE_SHA256: ${{ needs.render.outputs.bundle-sha256 }}
          DEVBOOK_EXPORT_RUN_ID: ${{ github.run_id }}
          DEVBOOK_EXPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEVBOOK_GITHUB_TOKEN: ${{ secrets.DEVBOOK_GITHUB_TOKEN }}
          DEVBOOK_IMPROVEMENT_MODE: apply
          DEVBOOK_IMPROVEMENT_ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
          DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED }}
          DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED }}
          DEVBOOK_IMPROVEMENT_PR_WORKFLOWS_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_PR_WORKFLOWS_CONFIRMED }}
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.100
          if [ "$EXPORT_MODE" = finalize ]; then
            dotnet run --project DevBook.Tooling -- export finalize --repo-root .. \
              --request ../artifacts/request/export-request.json --output ../artifacts/publication
          else
            dotnet run --project DevBook.Tooling -- export publish --repo-root .. \
              --request ../artifacts/request/export-request.json --bundle ../artifacts/export/bundle.json --output ../artifacts/publication
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devbook-publication-${{ github.run_id }}
          path: artifacts/publication
          if-no-files-found: warn
          overwrite: true
