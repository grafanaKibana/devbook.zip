name: Vault Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install Web dependencies
        working-directory: Web
        run: npm ci

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100

      - name: Test note review hooks
        run: node --test .codex/hooks/tests/note-review-hooks.test.mjs

      - name: Test native tooling core
        working-directory: .scripts
        run: |
          test "$(dotnet --version)" = 10.0.100
          dotnet test DevBook.Tooling.slnx --configuration Release

      - name: Validate full vault
        working-directory: .scripts
        run: |
          test "$(dotnet --version)" = 10.0.100
          dotnet run --no-cache --file DevBook.Tooling/Scripts/ValidateVault.cs -- --all --repo-root ..
