name: Site Build

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      build-site:
        default: true
        type: boolean
    outputs:
      artifact-id:
        value: ${{ jobs.site-check.outputs.artifact-id }}
      bundle-sha256:
        value: ${{ jobs.site-check.outputs.bundle-sha256 }}

permissions:
  contents: read

jobs:
  site-check:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.100
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix Web
      - name: Verify source-only ownership
        run: node .scripts/site-pipeline.mjs source-only
      - uses: ./.github/actions/obsidian
        id: obsidian
      - name: Export the actual candidate through native Obsidian
        working-directory: .scripts
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          APP_BUNDLE: ${{ steps.obsidian.outputs.app-bundle }}
          OUTPUT: ${{ runner.temp }}/devbook-native
        run: |
          set -euo pipefail
          dotnet run --project DevBook.Tooling -- site export --repo-root .. \
            --expected-head "$SOURCE_SHA" --app-bundle "$APP_BUNDLE" --output "$OUTPUT"
          dotnet run --project DevBook.Tooling -- site verify --repo-root .. \
            --expected-head "$SOURCE_SHA" --bundle "$OUTPUT/bundle.json" --extract
      - name: Build and validate Quartz
        if: inputs.build-site
        run: npm run build --prefix Web
      - id: digest
        name: Bind the native artifact bytes
        env:
          BUNDLE: ${{ runner.temp }}/devbook-native/bundle.json
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const digest = createHash('sha256').update(fs.readFileSync(process.env.BUNDLE)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${digest}\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: devbook-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/devbook-native/bundle.json
          if-no-files-found: error
          retention-days: 14
