name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, stage]

permissions:
  contents: read

jobs:
  site:
    uses: ./.github/workflows/site-check.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha }}

  pr-title:
    needs: site
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require actual native export and Quartz build
        env:
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          test "$SITE_RESULT" = success || { echo '::error::The actual PR source must pass native export and Quartz build.'; exit 1; }
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if printf '%s' "$TITLE" | grep -qE '^(feature|notes|docs|bug|fix|maintenance)!?: .+'; then
            echo "✓ $TITLE"
          else
            echo "::error::PR title must start with feature:, notes:, docs:, bug:, fix: or maintenance:."
            exit 1
          fi
      - name: Require configured artifact deployment before cutover
        env:
          READY: ${{ vars.DEVBOOK_ARTIFACT_DEPLOYMENT_READY }}
        run: |
          if [ "$READY" != true ]; then
            echo '::error::Artifact deployment is not configured. Configure Vercel IDs/token in Preview and Production, validate protected preview access and stage required checks, then set DEVBOOK_ARTIFACT_DEPLOYMENT_READY=true. Keep the migration PR draft; stage does not currently enforce required checks.'
            exit 1
          fi
