name: Delivery

on:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The merged PR's title decides a MAJOR (its `!`); commits decide the
          # rest. Look the title up from the pushed merge commit.
          TITLE=""
          for _ in 1 2 3; do
            TITLE=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq '.[0].title // ""' 2>/dev/null || true)
            [ -n "$TITLE" ] && break
            sleep 5
          done
          echo "Merged PR title: ${TITLE:-<none>}"
          bash .github/scripts/next-version.sh "$TITLE" | tee -a "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.version.outputs.bump != 'none'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.next }} --unreleased --strip header -o RELEASE_NOTES.md

      - name: Create tag + GitHub Release
        if: steps.version.outputs.bump != 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "$NEXT" \
            --target "$GITHUB_SHA" \
            --title "$NEXT" \
            --notes-file RELEASE_NOTES.md \
            --latest

  update:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.sender.login == 'vercel[bot]' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != 'https://stage.devbook.zip'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const deployment = context.payload.deployment;
            const { data: stage } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'stage',
            });
            if (deployment.sha !== stage.commit.sha) {
              core.info('Skipping a deployment that is not the current stage commit');
              return;
            }
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo, deployment_id: deployment.id, per_page: 1,
            });
            const latest = statuses[0];
            if (latest?.state !== 'success' || latest.environment_url === 'https://stage.devbook.zip') return;
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id,
              state: 'success', environment: 'Preview',
              environment_url: 'https://stage.devbook.zip',
              log_url: latest.log_url || latest.target_url || '',
              description: latest.description,
              auto_inactive: false,
            });
