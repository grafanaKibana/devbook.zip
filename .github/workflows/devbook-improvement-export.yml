name: DevBook Verified Export

on:
  pull_request:
    paths:
      - .github/workflows/devbook-improvement-export.yml
      - .scripts/devbook_improvement/desktop_export.py
      - .scripts/devbook_improvement/export_worker.py
      - .scripts/tests/test_devbook_improvement_desktop_export.py
      - .scripts/tests/test_devbook_improvement_export_worker.py
  workflow_dispatch:
    inputs:
      mode:
        description: Fixture smoke or verified export for an existing managed PR
        type: choice
        required: true
        default: fixture
        options: [fixture, managed]
      pr_number:
        description: Existing managed PR number; used only in managed mode
        type: string
        default: ''
      branch:
        description: Exact managed notes/automated-* branch
        type: string
        default: ''
      expected_head:
        description: Exact source commit SHA; stale exports never overwrite newer work
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: devbook-export-${{ inputs.branch || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    if: >-
      github.event_name == 'pull_request' || inputs.mode == 'fixture' ||
      (inputs.mode == 'managed' && vars.DEVBOOK_IMPROVEMENT_ACTIVATED == 'true')
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.export.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned genuine Obsidian desktop
        env:
          APP_ROOT: ${{ runner.temp }}/devbook-obsidian
        run: |
          set -euo pipefail
          mkdir -p "$APP_ROOT/mount"
          curl --fail --location --retry 2 \
            https://github.com/obsidianmd/obsidian-releases/releases/download/v1.14.5/Obsidian-1.14.5.dmg \
            --output "$APP_ROOT/Obsidian.dmg"
          printf '%s  %s\n' be79e6410d80fa705218aa4e8cb24ce8418cf16e13be4036227a5659b1f6aab2 "$APP_ROOT/Obsidian.dmg" | shasum -a 256 --check
          hdiutil attach "$APP_ROOT/Obsidian.dmg" -readonly -nobrowse -mountpoint "$APP_ROOT/mount"
          trap 'hdiutil detach "$APP_ROOT/mount" || true' EXIT
          ditto "$APP_ROOT/mount/Obsidian.app" "$APP_ROOT/Obsidian.app"
          codesign --verify --deep --strict "$APP_ROOT/Obsidian.app"
      - name: Render through isolated desktop profile
        id: export
        env:
          PYTHONPATH: .scripts
          EXPORT_MODE: ${{ github.event_name == 'pull_request' && 'fixture' || inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TOPIC_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          APP_BUNDLE: ${{ runner.temp }}/devbook-obsidian/Obsidian.app
          DEVBOOK_EXPORT_READ_TOKEN: ${{ inputs.mode == 'managed' && github.token || '' }}
        run: |
          set -euo pipefail
          if [ "$EXPORT_MODE" = fixture ]; then
            python3 -m devbook_improvement.export_worker fixture \
              --app-bundle "$APP_BUNDLE" --output artifacts/export
          else
            python3 -m devbook_improvement.export_worker render \
              --pr "$PR_NUMBER" --branch "$TOPIC_BRANCH" --expected-head "$EXPECTED_HEAD" \
              --app-bundle "$APP_BUNDLE" --output artifacts/export
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devbook-syncer-export-${{ github.run_id }}
          path: artifacts/export
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'managed' &&
      needs.render.outputs.ready == 'true'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: devbook-improvement-production
    steps:
      - name: Verify trusted workflow and activation
        env:
          ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$ACTIVATED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: devbook-syncer-export-${{ github.run_id }}
          path: artifacts/export
      - name: Publish verified generated files only
        env:
          PYTHONPATH: .scripts
          DEVBOOK_GITHUB_TOKEN: ${{ secrets.DEVBOOK_GITHUB_TOKEN }}
          DEVBOOK_IMPROVEMENT_MODE: apply
          DEVBOOK_IMPROVEMENT_ACTIVATED: ${{ vars.DEVBOOK_IMPROVEMENT_ACTIVATED }}
          DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_SUBSCRIPTION_ONLY_CONFIRMED }}
          DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED: ${{ vars.DEVBOOK_IMPROVEMENT_USAGE_CREDITS_DISABLED_CONFIRMED }}
        run: python3 -m devbook_improvement.export_worker publish --bundle artifacts/export/bundle.json
