name: Site Deployment

on:
  push:
    branches: [stage, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 65.16.0

jobs:
  native:
    if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site-check.yml
    with:
      source-sha: ${{ github.sha }}
      build-site: false

  package:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      deployment: false
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      package-sha256: ${{ steps.package.outputs.sha256 }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      SOURCE_SHA: ${{ github.sha }}
      NATIVE_SHA256: ${{ needs.native.outputs.bundle-sha256 }}
    steps:
      - name: Check protected deployment setup
        env:
          READY: ${{ vars.DEVBOOK_ARTIFACT_DEPLOYMENT_READY }}
          TOKEN_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          test "$READY" = true
          test "$TOKEN_PRESENT" = true
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.100
      - name: Verify the reviewed Vercel organization and project before pull
        run: node .scripts/site-pipeline.mjs configuration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.native.outputs.artifact-id }}
          path: ${{ runner.temp }}/native
          digest-mismatch: error
      - name: Verify native artifact and materialize generated inputs
        working-directory: .scripts
        env:
          BUNDLE: ${{ runner.temp }}/native/bundle.json
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          if (createHash('sha256').update(fs.readFileSync(process.env.BUNDLE)).digest('hex') !== process.env.NATIVE_SHA256) throw new Error('Native bundle digest mismatch');
          JS
          dotnet run --project DevBook.Tooling -- site verify --repo-root .. \
            --expected-head "$SOURCE_SHA" --bundle "$BUNDLE" --extract
      - name: Install build tools without deployment credentials
        run: |
          npm ci --prefix Web
          npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull protected Vercel settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="$TARGET" --git-branch="$GITHUB_REF_NAME"
      - name: Remove pulled secrets before repository or plugin build
        run: node .scripts/site-pipeline.mjs clean-env --target "$TARGET"
      - name: Build the accepted source for its deployment target
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then vercel build --prod; else vercel build; fi
          node .scripts/site-pipeline.mjs marker --source "$SOURCE_SHA" --target "$TARGET" --native "$NATIVE_SHA256"
      - name: Package only verified static Build Output
        id: package
        env:
          OUTPUT: ${{ runner.temp }}/package/deployment.json
        run: node .scripts/site-pipeline.mjs package --source "$SOURCE_SHA" --target "$TARGET" --native "$NATIVE_SHA256" --output "$OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: devbook-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package/deployment.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [native, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ github.ref_name == 'main' && 'https://devbook.zip' || 'https://stage.devbook.zip' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      SOURCE_SHA: ${{ github.sha }}
      NATIVE_SHA256: ${{ needs.native.outputs.bundle-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Verify the reviewed Vercel organization and project before upload
        run: node .scripts/site-pipeline.mjs configuration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/package
          digest-mismatch: error
      - name: Verify the accepted source and package bytes before deployment
        env:
          PACKAGE: ${{ runner.temp }}/package/deployment.json
          PACKAGE_SHA256: ${{ needs.package.outputs.package-sha256 }}
        run: node .scripts/site-pipeline.mjs extract --source "$SOURCE_SHA" --target "$TARGET" --native "$NATIVE_SHA256" --bundle "$PACKAGE" --digest "$PACKAGE_SHA256"
      - name: Upload the verified prebuilt deployment
        id: create
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node .scripts/site-pipeline.mjs deploy --source "$SOURCE_SHA" --target "$TARGET" --native "$NATIVE_SHA256"
      - name: Verify immutable build, recheck branch, publish and verify fixed URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ steps.create.outputs.deployment }}
        run: node .scripts/site-pipeline.mjs publish --source "$SOURCE_SHA" --target "$TARGET" --native "$NATIVE_SHA256" --deployment "$DEPLOYMENT"
