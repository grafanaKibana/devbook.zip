name: Preview Deployment Link

on: deployment_status

permissions:
  contents: read
  deployments: write

jobs:
  update:
    if: >-
      github.event.sender.login == 'vercel[bot]' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != 'https://stage.devbook.zip'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const deployment = context.payload.deployment;
            const { data: stage } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'stage',
            });
            if (deployment.sha !== stage.commit.sha) {
              core.info('Skipping a deployment that is not the current stage commit');
              return;
            }
            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              ...context.repo, deployment_id: deployment.id, per_page: 1,
            });
            const latest = statuses[0];
            if (latest?.state !== 'success' || latest.environment_url === 'https://stage.devbook.zip') return;
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: deployment.id,
              state: 'success', environment: 'Preview',
              environment_url: 'https://stage.devbook.zip',
              log_url: latest.log_url || latest.target_url || '',
              description: latest.description,
              auto_inactive: false,
            });
