<svg xmlns="http://www.w3.org/2000/svg" width="700" viewBox="0 0 700 420"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ca0b0" stroke-width="1.5"/></marker></defs><rect width="700" height="420" fill="white"/><g fill="#24273a" font-family="sans-serif"><text x="24" y="32" font-size="21" font-weight="700">Choose the smallest useful constraint</text><rect x="24" y="50" width="652" height="140" rx="6" fill="#f5f7fb" stroke="#9ca0b0"/><g font-family="monospace" font-size="16"><text x="42" y="78">T ValidateAndReturn&lt;T&gt;(T value)</text><text x="42" y="104" fill="#1e66f5" font-weight="700">    where T : IValidatable</text><text x="42" y="130">{</text><text x="42" y="154">    value.Validate(); return value;</text><text x="42" y="178">}</text></g><text x="24" y="222" font-size="14" fill="#5c6070">BODY NEEDS</text><text x="370" y="222" font-size="14" fill="#5c6070">DECLARATION GUARANTEES</text><text x="24" y="252" font-size="17">Call value.Validate()</text><path d="M235 246 H350" stroke="#9ca0b0" stroke-width="1.5" marker-end="url(#arrow)"/><text x="370" y="252" font-size="17" fill="#1e66f5" font-weight="700">where T : IValidatable</text><text x="370" y="274" font-size="14" fill="#5c6070">interface IValidatable { void Validate(); }</text><line x1="24" y1="292" x2="676" y2="292" stroke="#9ca0b0"/><text x="24" y="320" font-size="16" fill="#40a02b" font-weight="700">No new() needed</text><text x="240" y="320" font-size="16">An existing value is passed in.</text><text x="24" y="350" font-size="16" fill="#40a02b" font-weight="700">No class needed</text><text x="240" y="350" font-size="16">Classes and structs can implement IValidatable.</text><text x="24" y="393" font-size="16" fill="#5c6070">T in → T out: the caller’s type is preserved.</text></g></svg>
