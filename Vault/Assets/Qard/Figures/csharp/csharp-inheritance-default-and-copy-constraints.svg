<svg xmlns="http://www.w3.org/2000/svg" width="700" viewBox="0 0 700 610"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1e66f5"/></marker></defs><rect width="700" height="610" fill="white"/><g font-family="sans-serif" fill="#24273a"><text x="24" y="32" font-size="22" font-weight="700">Choosing C# type semantics</text><text x="24" y="65" font-size="17" font-weight="700">1. Inheritance: keep class families separate</text><g font-size="16" text-anchor="middle"><rect x="24" y="84" width="180" height="40" rx="5" fill="white" stroke="#1e66f5"/><text x="114" y="109">ordinary derived class</text><path d="M211 104 H459" stroke="#1e66f5" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="96" fill="#5c6070" font-size="14">extends</text><rect x="470" y="84" width="206" height="40" rx="5" fill="white" stroke="#1e66f5"/><text x="573" y="109">ordinary base class</text><rect x="24" y="140" width="180" height="40" rx="5" fill="white" stroke="#1e66f5"/><text x="114" y="165">derived record class</text><path d="M211 160 H459" stroke="#1e66f5" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="152" fill="#5c6070" font-size="14">extends</text><rect x="470" y="140" width="206" height="40" rx="5" fill="white" stroke="#1e66f5"/><text x="573" y="165">base record class</text></g><g font-size="15"><text x="24" y="204" fill="#d20f39">No ordinary-class ↔ record-class inheritance; bases must be unsealed.</text><text x="24" y="229">Struct / record struct: no user-defined base or derived types.</text><text x="24" y="252" fill="#5c6070">All four can implement interfaces; interfaces add no shared instance state.</text></g><path d="M24 270 H676" stroke="#9ca0b0"/><text x="24" y="299" font-size="17" font-weight="700">2. default(T): can the zero state represent a valid value?</text><path d="M350 316 V410" stroke="#9ca0b0"/><g font-size="16"><text x="24" y="337" fill="#1e66f5" font-weight="700">class / record class</text><text x="24" y="365">null reference</text><text x="24" y="391" fill="#5c6070">No instance exists.</text><text x="374" y="337" fill="#fe640b" font-weight="700">struct / record struct</text><text x="374" y="365">Numeric fields = 0; references = null</text><text x="374" y="391" fill="#5c6070">Constructor validation is bypassed.</text><text x="24" y="434" fill="#fe640b">Positive-quantity struct: define how its zero value is handled.</text></g><path d="M24 453 H676" stroke="#9ca0b0"/><text x="24" y="482" font-size="17" font-weight="700">3. Assignment b = a: what gets copied?</text><g font-size="16"><text x="24" y="513" fill="#1e66f5">class / record class</text><text x="374" y="513" fill="#fe640b">struct / record struct</text><text x="24" y="540">Reference → same instance</text><text x="374" y="540">Fields → separate value</text><text x="24" y="569" fill="#5c6070">Record equality does not alter copying; readonly still has value semantics.</text><text x="24" y="594" fill="#5c6070">Large value? Consider a record class; measure actual workload costs.</text></g></g></svg>
