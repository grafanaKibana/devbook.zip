<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#1e66f5"/></marker></defs><rect width="700" height="430" fill="white"/><g font-family="sans-serif" fill="#24273a"><text x="30" y="30" font-size="19" font-weight="bold">Struct fields are copied; the array stays shared</text><text x="30" y="59" font-size="15" font-family="monospace">struct Data { public int Number; public int[] Items; }</text><text x="30" y="86" font-size="14" fill="#5c6070">Initially: a.Number = 3; a.Items = new[] { 1, 2 };</text><text x="30" y="113" font-size="16" font-family="monospace">b = a;   b.Number = 9;   b.Items[0] = 7;</text><text x="30" y="145" font-size="14" fill="#5c6070">State after all three statements:</text><rect x="50" y="162" width="240" height="128" rx="7" fill="white" stroke="#9ca0b0"/><rect x="410" y="162" width="240" height="128" rx="7" fill="white" stroke="#9ca0b0"/><text x="68" y="189" font-size="18" font-weight="bold">a</text><text x="428" y="189" font-size="18" font-weight="bold">b</text><path d="M50 201 H290 M410 201 H650" stroke="#9ca0b0"/><text x="68" y="228" font-size="17" font-family="monospace">Number: 3</text><text x="428" y="228" font-size="17" font-family="monospace" fill="#fe640b">Number: 9</text><text x="68" y="267" font-size="17" font-family="monospace">Items:</text><text x="428" y="267" font-size="17" font-family="monospace">Items:</text><circle cx="168" cy="261" r="5" fill="#1e66f5"/><circle cx="528" cy="261" r="5" fill="#1e66f5"/><path d="M168 261 L168 325 L299 359" fill="none" stroke="#1e66f5" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 261 L528 325 L401 359" fill="none" stroke="#1e66f5" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="317" text-anchor="middle" font-size="14" fill="#1e66f5">Two reference fields, one array</text><rect x="300" y="341" width="100" height="47" fill="white" stroke="#9ca0b0"/><path d="M350 341 V388" stroke="#9ca0b0"/><text x="325" y="372" text-anchor="middle" font-size="22" fill="#40a02b">7</text><text x="375" y="372" text-anchor="middle" font-size="22">2</text><text x="325" y="408" text-anchor="middle" font-size="13" fill="#5c6070">[0]</text><text x="375" y="408" text-anchor="middle" font-size="13" fill="#5c6070">[1]</text></g></svg>
